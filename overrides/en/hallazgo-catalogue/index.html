<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Hallazgo — catalogue | OOLITA</title>
  <meta name="description" content="The Hallazgo catalogue by Raquel Costantini. An illustrated record of the works.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://oolita.es/en/hallazgo-catalogue/">
  <link rel="alternate" hreflang="es" href="https://oolita.es/catalogo-hallazgo/">
  <link rel="alternate" hreflang="en" href="https://oolita.es/en/hallazgo-catalogue/">
  <link rel="alternate" hreflang="x-default" href="https://oolita.es/catalogo-hallazgo/">
  <link rel="stylesheet" href="/fonts/fonts.v3.css">
  <style>
    :root{--paper:#F1E7D4;--blue:#184EC8;--ink:#132572}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--paper)}
    body.hallazgo-catalogue{min-height:100svh!important;background:var(--paper)!important;color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif}
    .catalogue-header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,52px);position:relative;z-index:2}
    .catalogue-header a{color:var(--ink);text-decoration:none;font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
    .catalogue-header .brand{font-size:15px;letter-spacing:.16em}
    .catalogue-main{min-height:calc(100svh - 72px);display:grid;place-items:center;padding:clamp(22px,5vw,58px) 18px clamp(42px,7vw,76px)}
    .catalogue-frame{width:min(88vw,30rem);background:var(--blue);padding:clamp(14px,3.6vw,30px);line-height:0}
    .catalogue-frame img{display:block;width:100%;height:auto;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important}
    .hallazgo-catalogue .sr-only,.hallazgo-catalogue footer.sr-only,.hallazgo-catalogue footer.sr-only *{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;font-size:1px!important;line-height:1!important}
    @media(max-width:560px){.catalogue-header{height:62px;padding-inline:18px}.catalogue-main{min-height:calc(100svh - 62px);padding:18px 14px 34px}.catalogue-frame{width:min(89vw,28rem);padding:14px}}
  </style>
</head>
<body class="hallazgo-catalogue">
  <header class="catalogue-header">
    <a class="brand" href="/en/" aria-label="OOLITA, home">OOLITA</a>
    <a href="/catalogo-hallazgo/" hreflang="es" lang="es">Español</a>
  </header>
  <main class="catalogue-main">
    <h1 class="sr-only">Hallazgo — catalogue</h1>
    <div class="catalogue-frame">
      <img src="/hallazgo/hallazgo-catalogue-cover.jpg" width="321" height="356" alt="Cover of the Hallazgo catalogue by Raquel Costantini" decoding="async" fetchpriority="high">
    </div>
  </main>
  <footer class="sr-only">OOLITA · Raquel Costantini</footer>
</body>
</html>
