name: Temporary OOLITA production audit supplemental

on:
  push:
    branches:
      - audit/live-production-20260823
    paths:
      - '.github/workflows/production-audit-temp.yml'

permissions:
  contents: write

concurrency:
  group: oolita-production-audit-supplemental
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated audit branch
        uses: actions/checkout@v4

      - name: Validate current main-equivalent build without deploying
        id: source_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_site_for_deploy.sh
          python3 scripts/apply_direction_v3.py site
          python3 scripts/growth_prep.py site
          python3 scripts/apply_growth_v1.py site
          python3 scripts/apply_commerce.py site commerce/catalog.json
          python3 scripts/apply_list_completion_v1.py site
          python3 scripts/apply_follow_transition_v1.py site
          python3 scripts/apply_release_calendar_v1.py site
          python3 scripts/apply_audit_fixes_v1.py site
          python3 scripts/apply_first_party_analytics_v1.py site
          python3 scripts/apply_search_visibility_v1.py site
          node --check functions/api/event.js
          npx --yes wrangler@latest pages functions build functions --outfile /tmp/oolita-worker.js

      - name: Install browser audit dependencies
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium

      - name: Audit real mobile viewports and corrected assertions
        env:
          SOURCE_BUILD_STATUS: ${{ steps.source_build.outcome }}
        run: node .github/audit/supplemental-audit.mjs

      - name: Record sanitized supplemental result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-results/production-audit-supplemental.json audit-results/production-audit-supplemental.md
          git commit -m 'Record supplemental production audit [skip ci]' || exit 0
          git pull --rebase origin audit/live-production-20260823
          git push origin HEAD:audit/live-production-20260823
