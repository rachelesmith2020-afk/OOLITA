name: Temporary OOLITA final production audit

on:
  push:
    branches:
      - audit/live-production-20260823
    paths:
      - '.github/workflows/production-audit-temp.yml'

permissions:
  contents: write

concurrency:
  group: oolita-production-audit-supplemental
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c608b5c0e07dc00bd74aa24c9cc78c4a
      TARGET_MAIN_SHA: f7a92dfc09b790eb4f6f63691a2f300c4f7a9927
    steps:
      - name: Check out isolated audit branch
        uses: actions/checkout@v4

      - name: Install browser audit dependencies
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium

      - name: Patch audit runner for explicit contexts and final wording invariant
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/audit/final-audit.mjs')
          s=p.read_text()
          old="const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});"
          new="const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});const page=await context.newPage();"
          if old not in s:
              raise SystemExit('browser.newPage patch target missing')
          s=s.replace(old,new,1)
          old2="await page.close();return d;"
          new2="await context.close();return d;"
          if old2 not in s:
              raise SystemExit('context close patch target missing')
          s=s.replace(old2,new2,1)
          old3="enDesk.bodyText.includes('OOLITA begins with a three-metre classical labyrinth')&&esDesk.bodyText.includes('OOLITA comienza con un laberinto clásico de tres metros')"
          new3="enDesk.bodyText.includes('OOLITA begins with a three-metre classical labyrinth')&&enDesk.bodyText.includes('built from stone')&&!enDesk.bodyText.includes('loose calcarenite')&&esDesk.bodyText.includes('OOLITA comienza con un laberinto clásico de tres metros')"
          if old3 not in s:
              raise SystemExit('homepage invariant patch target missing')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY

      - name: Verify exact production deployment and audit live site
        run: node .github/audit/final-audit.mjs

      - name: Record sanitized final audit result
        if: always()
        run: |
          git restore .github/audit/final-audit.mjs || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-results/final-production-audit.json audit-results/final-production-audit.md
          git commit -m 'Record final production audit [skip ci]' || exit 0
          git pull --rebase origin audit/live-production-20260823
          git push origin HEAD:audit/live-production-20260823
