name: Temporary OOLITA production audit

on:
  push:
    branches:
      - audit/live-production-20260823
    paths:
      - '.github/workflows/production-audit-temp.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c608b5c0e07dc00bd74aa24c9cc78c4a
      TARGET_MAIN_SHA: 04ccf748492b8f7a741bfc5a79d809effa30688c
    steps:
      - name: Check out isolated audit branch
        uses: actions/checkout@v4

      - name: Install browser audit dependencies
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium

      - name: Audit production and Cloudflare state
        run: node .github/audit/production-audit.mjs

      - name: Record sanitized audit result on isolated branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-results/production-audit.json audit-results/production-audit.md
          git commit -m 'Record isolated production audit [skip ci]' || exit 0
          git push origin HEAD:audit/live-production-20260823
