name: Inspect Cloudflare Pages runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-cloudflare-pages-runtime.yml'
      - 'scripts/report_pages_runtime.py'
      - 'scripts/verify_cloudflare_analytics.py'

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report current Pages runtime configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c608b5c0e07dc00bd74aa24c9cc78c4a
        run: python3 scripts/report_pages_runtime.py

      - name: Report recent main push deployment runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-cloudflare-pages.yml/runs?branch=main&event=push&per_page=10" \
            | jq '{workflow_runs: [.workflow_runs[] | {id, run_number, status, conclusion, head_sha, created_at, updated_at}]}'

      - name: Download current Pages Wrangler configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c608b5c0e07dc00bd74aa24c9cc78c4a
        shell: bash
        run: |
          set -euo pipefail
          rm -f wrangler.json wrangler.jsonc wrangler.toml
          npx --yes wrangler@latest pages download config oolita --force
          config="$(find . -maxdepth 1 -type f \( -name 'wrangler.json' -o -name 'wrangler.jsonc' -o -name 'wrangler.toml' \) -print -quit)"
          if [ -z "$config" ]; then
            echo 'Wrangler did not generate a configuration file.' >&2
            exit 1
          fi
          cp "$config" /tmp/oolita-wrangler-dashboard-config
          printf 'generated_config=%s\n' "$config"

      - name: Upload generated Wrangler configuration
        uses: actions/upload-artifact@v4
        with:
          name: oolita-pages-dashboard-config
          path: /tmp/oolita-wrangler-dashboard-config
          if-no-files-found: error
          retention-days: 1
