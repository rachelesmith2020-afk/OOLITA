name: Emergency Cloudflare cache purge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ZONE_CACHE_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_CACHE_TOKEN }}
      CLOUDFLARE_ZONE_ID: d637c2a2909ff813adc29989796088f1
    steps:
      - name: Purge complete OOLITA custom-domain cache
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ZONE_CACHE_TOKEN:-}" || {
            echo 'Missing CLOUDFLARE_ZONE_CACHE_TOKEN. This workflow needs a Cloudflare token with Zone > Cache Purge permission for oolita.es.'
            exit 1
          }
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ['CLOUDFLARE_ZONE_CACHE_TOKEN']
          zone_id = os.environ['CLOUDFLARE_ZONE_ID']
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          body = json.dumps({'purge_everything': True}).encode()
          purge = urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/zones/{zone_id}/purge_cache',
              data=body, headers=headers, method='POST'
          )
          with urllib.request.urlopen(purge, timeout=30) as r:
              result = json.load(r)
          if not result.get('success'):
              raise SystemExit('Cloudflare cache purge failed: ' + json.dumps(result))
          print('Purged the complete OOLITA Cloudflare cache for oolita.es')
          PY
