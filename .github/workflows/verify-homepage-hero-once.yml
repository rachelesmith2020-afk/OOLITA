name: One-shot OOLITA live hero verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-homepage-hero-once.yml'

permissions:
  contents: write

concurrency:
  group: oolita-one-shot-hero-fix
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm repaired CSS is live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            curl -fsSL -H 'Cache-Control: no-cache' \
              "https://oolita.es/?hero-verify=$GITHUB_RUN_ID-$attempt" \
              -o /tmp/oolita-home.html || true
            if grep -Fq 'font-size:clamp(4.25rem,10vw,9rem)!important' /tmp/oolita-home.html \
              && grep -Fq 'white-space:nowrap!important' /tmp/oolita-home.html; then
              echo "Repaired production CSS confirmed on oolita.es (attempt $attempt)."
              exit 0
            fi
            echo "Waiting for repaired production HTML ($attempt/24)…"
            sleep 5
          done
          echo 'Repaired homepage CSS is not present on oolita.es.' >&2
          exit 1

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Verify Spanish and English hero geometry
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const cases = [
              ['https://oolita.es/','PIEDRA'],
              ['https://oolita.es/en/','STONE']
            ];
            for (const width of [909, 390]) {
              for (const [url, expected] of cases) {
                const page = await browser.newPage({viewport:{width,height:685}});
                await page.goto(url + '?geometry-verify=' + Date.now(), {waitUntil:'networkidle'});
                const result = await page.evaluate(() => {
                  const field = document.querySelector('#oolita-art-field-stone');
                  const copy = field?.querySelector('.art-copy');
                  const kicker = field?.querySelector('.art-kicker');
                  const word = field?.querySelector('.art-word');
                  const caption = field?.querySelector('.art-caption');
                  if (!field || !copy || !kicker || !word || !caption) return {missing:true};
                  const wr = word.getBoundingClientRect();
                  const cr = copy.getBoundingClientRect();
                  const kr = kicker.getBoundingClientRect();
                  const cap = caption.getBoundingClientRect();
                  return {
                    text: word.textContent.trim(),
                    whiteSpace: getComputedStyle(word).whiteSpace,
                    wordWidth: wr.width,
                    wordHeight: wr.height,
                    copyWidth: cr.width,
                    kickerBottom: kr.bottom,
                    wordTop: wr.top,
                    captionTop: cap.top,
                    wordBottom: wr.bottom,
                    viewport: innerWidth,
                    scrollWidth: document.documentElement.scrollWidth
                  };
                });
                console.log(JSON.stringify({width,url,...result}));
                if (result.missing) throw new Error(width + ' ' + url + ' missing stone field nodes');
                if (result.text !== expected) throw new Error(width + ' ' + url + ' wrong word: ' + result.text);
                if (result.whiteSpace !== 'nowrap') throw new Error(width + ' ' + url + ' word can wrap');
                if (result.wordWidth > result.copyWidth + 1) throw new Error(width + ' ' + url + ' word exceeds copy width');
                if (result.kickerBottom > result.wordTop + 1) throw new Error(width + ' ' + url + ' kicker overlaps word');
                if (result.captionTop < result.wordBottom - 1) throw new Error(width + ' ' + url + ' caption overlaps word');
                if (result.scrollWidth > result.viewport + 1) throw new Error(width + ' ' + url + ' horizontal overflow');
                await page.close();
              }
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Remove this one-shot workflow after success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          rm -f .github/workflows/verify-homepage-hero-once.yml
          git add .github/workflows/verify-homepage-hero-once.yml
          git commit -m 'Remove one-shot live hero verification [skip ci]'
          git push origin HEAD:main
