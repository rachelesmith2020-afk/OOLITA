name: OOLITA post-deploy live audit

on:
  workflow_run:
    workflows: ["Deploy OOLITA to Cloudflare Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: oolita-post-deploy-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  live-audit:
    if: >-
      ${{ github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify textile Stripe source is two-storefront one-price and persistent
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const { TEXTILE } = await import('./functions/_lib/textile-config.js');
          const storefronts = Object.keys(TEXTILE.storefronts).sort();
          const variants = Object.keys(TEXTILE.variants).sort();
          if (JSON.stringify(storefronts) !== JSON.stringify(['en', 'es'])) throw new Error(`Textile storefronts must be exactly en + es; found ${storefronts.join(', ')}`);
          if (JSON.stringify(variants) !== JSON.stringify(['oversized'])) throw new Error(`Textile variants must be exactly oversized; found ${variants.join(', ')}`);
          if (TEXTILE.stripePriceEnv !== 'TEXTILE_BLASTER_PRICE_GBP_ID') throw new Error('Textile checkout must use one shared Blaster Stripe Price env');
          if ('priceEnv' in TEXTILE.storefronts.es || 'priceEnv' in TEXTILE.storefronts.en) throw new Error('Locale storefronts must not define separate Stripe prices');
          if (TEXTILE.storefronts.es.page !== 'https://oolita.es/ediciones/camiseta/') throw new Error('Spanish textile storefront points at the wrong page');
          if (TEXTILE.storefronts.en.page !== 'https://oolita.es/en/editions/t-shirt/') throw new Error('English textile storefront points at the wrong page');
          console.log('Textile source has exactly two language storefronts, one Blaster variant and one Stripe Price.');
          NODE
          if grep -Fq 'line_items[0][price_data]' functions/api/textile-checkout.js; then echo 'Inline Stripe price_data found'; exit 1; fi
          if grep -Fq 'product_data' functions/api/textile-checkout.js; then echo 'Inline Stripe product_data found'; exit 1; fi
          if ! grep -Fq 'line_items[0][price]' functions/api/textile-checkout.js; then echo 'Persistent Stripe price reference missing'; exit 1; fi
          if grep -Rq 'TEXTILE_ES_BLASTER_PRICE_GBP_ID\|TEXTILE_EN_BLASTER_PRICE_GBP_ID' functions commerce; then echo 'Retired per-locale Stripe Price env remains'; exit 1; fi
          echo 'Textile Stripe checkout reuses one persistent Blaster price across ES and EN.'

      - name: Run fail-closed live SEO audit
        shell: bash
        run: python3 scripts/audit_live_seo_v1.py https://oolita.es

      - name: Verify real 404 response
        shell: bash
        run: |
          set -euo pipefail
          probe="https://oolita.es/__oolita-live-404-probe-${{ github.event.workflow_run.head_sha }}/"
          code="$(curl -sS -o /tmp/oolita-404-body -D /tmp/oolita-404-headers -w '%{http_code}' "$probe")"
          if [ "$code" != "404" ]; then echo "Expected HTTP 404 for $probe, got $code"; cat /tmp/oolita-404-headers; exit 1; fi
          if grep -Eiq '^location:' /tmp/oolita-404-headers; then echo "404 probe unexpectedly redirected"; cat /tmp/oolita-404-headers; exit 1; fi
          echo 'Live 404 verified: HTTP 404, no redirect.'

      - name: Verify single Blaster public state
        shell: bash
        run: |
          set -euo pipefail
          urls=('https://oolita.es/ediciones/camiseta/' 'https://oolita.es/en/editions/t-shirt/' 'https://oolita.es/ediciones/' 'https://oolita.es/en/editions/')
          retired='RE-Creator|STTU787|two unisex cuts|dos cortes unisex|regular and heavy oversized|regular y heavy oversized'
          for url in "${urls[@]}"; do body="$(curl -fsSL "$url")"; if grep -Eiq "$retired" <<<"$body"; then echo "Retired textile copy found at $url"; exit 1; fi; done
          es="$(curl -fsSL https://oolita.es/ediciones/camiseta/)"
          en="$(curl -fsSL https://oolita.es/en/editions/t-shirt/)"
          if [[ "$es" != *"Stanley/Stella Blaster 2.0"* ]]; then echo 'Blaster 2.0 missing from Spanish T-shirt page'; exit 1; fi
          if [[ "$en" != *"Stanley/Stella Blaster 2.0"* ]]; then echo 'Blaster 2.0 missing from English T-shirt page'; exit 1; fi
          echo 'Single Blaster public state verified in both languages.'

      - name: Verify legacy 3D links are not internal stragglers
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://oolita.es/' 'https://oolita.es/en/' 'https://oolita.es/mundo-3d/' 'https://oolita.es/en/3d-world/'; do
            body="$(curl -fsSL "$url")"
            if grep -Fq '?follow=3d' <<<"$body"; then echo "Internal ?follow=3d straggler found at $url"; exit 1; fi
          done
          echo 'No internal ?follow=3d stragglers found.'
