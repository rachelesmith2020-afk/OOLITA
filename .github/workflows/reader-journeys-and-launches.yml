name: OOLITA reader journeys and launch clock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reader-journeys-and-launches.yml'
      - 'scripts/apply_post_audit_growth_system_v1.py'
      - 'scripts/report_reader_journeys.py'
      - 'COPY_FREEZE.md'
  workflow_run:
    workflows: ["Deploy OOLITA to Cloudflare Pages"]
    types: [completed]
  schedule:
    # 00:05 Europe/Madrid on the confirmed 2027 launch dates.
    - cron: '5 23 2 1 *'   # 03 Jan 2027 · CET · 3D world
    - cron: '5 23 30 1 *'  # 31 Jan 2027 · CET · book
    - cron: '5 22 10 4 *'  # 11 Apr 2027 · CEST · textile
    - cron: '5 22 15 9 *'  # 16 Sep 2027 · CEST · Hallazgo publication
    - cron: '5 22 18 9 *'  # 19 Sep 2027 · CEST · Hallazgo public launch
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  report:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c608b5c0e07dc00bd74aa24c9cc78c4a
    steps:
      - uses: actions/checkout@v4
      - name: Report first-party reader journeys
        run: python3 scripts/report_reader_journeys.py

  launch:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y)" != "2027" ]; then
            echo 'Launch clock is scoped to 2027; no deployment dispatched.'
            exit 0
          fi
          gh workflow run deploy-cloudflare-pages.yml -R rachelesmith2020-afk/OOLITA -f confirm=DEPLOY
          echo 'Production rebuild dispatched.'
