name: One-shot OOLITA contrast diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contrast-diagnostic-once.yml'

permissions:
  contents: write

concurrency:
  group: oolita-contrast-diagnostic-once
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and Axe
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@latest axe-core@latest
          npx playwright install --with-deps chromium
      - name: Capture exact live contrast failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const axePath = require.resolve('axe-core/axe.min.js');
          const urls = [
            'https://oolita.es/',
            'https://oolita.es/en/',
            'https://oolita.es/ediciones/libro/',
            'https://oolita.es/en/editions/book/',
            'https://oolita.es/domingos/',
            'https://oolita.es/en/sundays/'
          ];
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const report = {generated_at:new Date().toISOString(), pages:[], total:0};
            for (const url of urls) {
              const page = await browser.newPage({viewport:{width:1280,height:900}});
              await page.goto(url + '?contrast-diagnostic=' + Date.now(), {waitUntil:'networkidle'});
              await page.addScriptTag({path:axePath});
              const nodes = await page.evaluate(async()=>{
                const out = await axe.run(document, {runOnly:{type:'rule',values:['color-contrast']}});
                return out.violations.flatMap(v => v.nodes.map(n => ({
                  id:v.id, impact:v.impact, target:n.target, html:n.html, failureSummary:n.failureSummary
                })));
              });
              const enriched=[];
              for (const item of nodes) {
                const selector = Array.isArray(item.target) ? item.target[0] : item.target;
                const details = await page.evaluate((sel)=>{
                  let el;
                  try { el = document.querySelector(sel); } catch { return {selectorError:true}; }
                  if (!el) return {missing:true};
                  const cs = getComputedStyle(el);
                  const chain=[];
                  let p=el;
                  while(p && p.nodeType===1){
                    const s=getComputedStyle(p);
                    chain.push({tag:p.tagName, id:p.id||'', cls:(typeof p.className==='string'?p.className:''), opacity:s.opacity, color:s.color, background:s.backgroundColor});
                    p=p.parentElement;
                  }
                  return {
                    text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,180),
                    color:cs.color, background:cs.backgroundColor, opacity:cs.opacity,
                    fontSize:cs.fontSize, fontWeight:cs.fontWeight, chain:chain.slice(0,8)
                  };
                }, selector);
                enriched.push({...item, selector, details});
              }
              report.pages.push({url,count:enriched.length,nodes:enriched});
              report.total += enriched.length;
              await page.close();
            }
            await browser.close();
            fs.writeFileSync('audit-results/contrast-diagnostic.json', JSON.stringify(report,null,2));
            console.log('TOTAL_CONTRAST_NODES=' + report.total);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-results/contrast-diagnostic.json
          git commit -m 'Record live contrast diagnostic [skip ci]'
          git push origin HEAD:main
