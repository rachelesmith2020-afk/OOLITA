name: One-shot OOLITA contrast diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contrast-diagnostic-once.yml'

permissions:
  contents: write

concurrency:
  group: oolita-contrast-diagnostic-once
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and Axe
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@latest axe-core@latest
          npx playwright install --with-deps chromium
      - name: Capture unique live contrast failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const axePath = require.resolve('axe-core/axe.min.js');
          const urls = [
            'https://oolita.es/',
            'https://oolita.es/en/',
            'https://oolita.es/ediciones/libro/',
            'https://oolita.es/en/editions/book/',
            'https://oolita.es/domingos/',
            'https://oolita.es/en/sundays/'
          ];
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const report = {generated_at:new Date().toISOString(), pages:[], total_nodes:0};
            for (const url of urls) {
              const page = await browser.newPage({viewport:{width:1280,height:900}});
              await page.goto(url + '?contrast-summary=' + Date.now(), {waitUntil:'networkidle'});
              await page.addScriptTag({path:axePath});
              const raw = await page.evaluate(async()=>{
                const out = await axe.run(document, {runOnly:{type:'rule',values:['color-contrast']}});
                return out.violations.flatMap(v => v.nodes.map(n => ({target:n.target, failureSummary:n.failureSummary})));
              });
              const groups = new Map();
              for (const item of raw) {
                const selector = Array.isArray(item.target) ? item.target[0] : item.target;
                const key = selector.replace(/:nth-child\(\d+\)/g, ':nth-child(*)');
                if (!groups.has(key)) groups.set(key,{selector:key,count:0,example_selector:selector,failureSummary:item.failureSummary});
                groups.get(key).count++;
              }
              const unique=[];
              for (const group of groups.values()) {
                const details = await page.evaluate((sel)=>{
                  let el;
                  try { el = document.querySelector(sel); } catch { return {selectorError:true}; }
                  if (!el) return {missing:true};
                  const cs=getComputedStyle(el);
                  return {text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,140),color:cs.color,background:cs.backgroundColor,opacity:cs.opacity,fontSize:cs.fontSize,fontWeight:cs.fontWeight,className:(typeof el.className==='string'?el.className:'')};
                }, group.example_selector);
                unique.push({...group,details});
              }
              report.pages.push({url,node_count:raw.length,unique});
              report.total_nodes += raw.length;
              await page.close();
            }
            await browser.close();
            fs.writeFileSync('audit-results/contrast-summary.json', JSON.stringify(report,null,2));
            console.log('TOTAL_CONTRAST_NODES=' + report.total_nodes);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add audit-results/contrast-summary.json
          git commit -m 'Record live contrast summary [skip ci]'
          git push origin HEAD:main
