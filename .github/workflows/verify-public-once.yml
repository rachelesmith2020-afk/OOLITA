name: Verify public OOLITA domain once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-once.yml'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public domain and report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          result=failure
          detail='reviewed wording not visible at https://oolita.es/'
          for i in $(seq 1 24); do
            body="$(curl -fsSL "https://oolita.es/?verify=${stamp}-${i}" || true)"
            if printf '%s' "$body" | grep -Fq 'El mismo camino, hecho de luz.' && \
               printf '%s' "$body" | grep -Fq 'La misma senda en tres materiales.'; then
              result=success
              detail='reviewed wording is live at https://oolita.es/'
              break
            fi
            sleep 5
          done
          gh issue create --repo "$GITHUB_REPOSITORY" --title "OOLITA public verification: ${result}" --body "${detail}. Verification run: ${GITHUB_RUN_ID}."
          test "$result" = success
