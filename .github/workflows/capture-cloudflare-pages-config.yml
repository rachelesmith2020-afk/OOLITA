name: Capture Cloudflare Pages config

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-cloudflare-pages-config.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: c608b5c0e07dc00bd74aa24c9cc78c4a

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Download current Pages configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          npx --yes wrangler@latest pages download config oolita --force
          config="$(find . -maxdepth 1 -type f \( -name 'wrangler.toml' -o -name 'wrangler.json' -o -name 'wrangler.jsonc' \) -print -quit)"
          test -n "$config"
          printf '%s\n' "$config" > /tmp/config-path.txt

      - name: Upload configuration for inspection
        uses: actions/upload-artifact@v4
        with:
          name: oolita-cloudflare-pages-config
          path: |
            wrangler.toml
            wrangler.json
            wrangler.jsonc
          if-no-files-found: error
          retention-days: 1
