name: One-time validated OOLITA production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-once.yml'

permissions:
  contents: read

concurrency:
  group: oolita-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c608b5c0e07dc00bd74aa24c9cc78c4a

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }

      - name: Reconstruct and validate complete site
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_site_for_deploy.sh

      - name: Deploy complete site to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy site --project-name=oolita --commit-dirty=true

      - name: Verify clean Pages origin
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          ok=0
          for i in $(seq 1 12); do
            body="$(curl -fsSL "https://oolita.pages.dev/?deploy=${stamp}-${i}" || true)"
            if printf '%s' "$body" | grep -Fq 'El mismo camino, hecho de luz.' && \
               printf '%s' "$body" | grep -Fq 'La misma senda en tres materiales.'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1 || { echo 'Pages origin did not show reviewed wording after deploy'; exit 1; }
          echo 'OOLITA Pages origin verified after deployment.'
