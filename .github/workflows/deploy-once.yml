name: One-shot OOLITA production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-once.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: oolita-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c608b5c0e07dc00bd74aa24c9cc78c4a
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Mark deployment pending
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"oolita/production-deploy","description":"OOLITA production deployment running"}'

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo 'Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN'
            exit 1
          }

      - name: Reconstruct and validate complete site
        shell: bash
        run: bash scripts/build_site_for_deploy.sh

      - name: Deploy complete site to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy site --project-name=oolita --commit-dirty=true

      - name: Report deployment result
        if: always()
        shell: bash
        run: |
          state='failure'
          description='OOLITA production deployment failed'
          if [ "${{ job.status }}" = 'success' ]; then
            state='success'
            description='OOLITA production deployment succeeded'
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"oolita/production-deploy\",\"description\":\"${description}\"}"
