name: Activate OOLITA Cloudflare Follow

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ACTIVATE to provision the first-party OOLITA list'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oolita-cloudflare-follow
  cancel-in-progress: false

jobs:
  activate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'ACTIVATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c608b5c0e07dc00bd74aa24c9cc78c4a

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }

      - name: Provision and bind subscriber storage
        id: subscriber_storage
        continue-on-error: true
        shell: bash
        run: python3 scripts/configure_cloudflare_subscribers.py

      - name: Report blocked subscriber-storage prerequisite
        if: ${{ steps.subscriber_storage.outcome != 'success' }}
        shell: bash
        run: |
          echo '::warning::Follow OOLITA is safely inactive because the current Cloudflare API token cannot manage D1. Add Account > D1 > Edit to the token, then rerun this workflow.'

      - name: Reconstruct and validate complete site
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: bash scripts/build_site_for_deploy.sh

      - name: Remove unsupported Analytics Engine binding
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: python3 scripts/configure_cloudflare_analytics.py

      - name: Report Analytics Engine binding state
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: python3 scripts/verify_cloudflare_analytics.py

      - name: Apply and validate Cabo de Gata direction
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: python3 scripts/apply_direction_v3.py site

      - name: Prepare homepage growth definition
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: python3 scripts/growth_prep.py site

      - name: Apply and validate growth layer
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: python3 scripts/apply_growth_v1.py site

      - name: Apply and validate commerce configuration
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: python3 scripts/apply_commerce.py site commerce/catalog.json

      - name: Apply and validate improvement-list completion
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: python3 scripts/apply_list_completion_v1.py site

      - name: Activate first-party Follow OOLITA
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: python3 scripts/apply_follow_transition_v1.py site

      - name: Apply and validate release calendar
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: python3 scripts/apply_release_calendar_v1.py site

      - name: Apply and validate accessibility, discovery and privacy audit fixes
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: python3 scripts/apply_audit_fixes_v1.py site

      - name: Apply and validate first-party analytics
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: python3 scripts/apply_first_party_analytics_v1.py site

      - name: Apply and validate search visibility
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: python3 scripts/apply_search_visibility_v1.py site

      - name: Validate Pages Functions
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/api/event.js
          node --check functions/api/subscribe.js
          node --check functions/api/unsubscribe.js
          npx --yes wrangler@latest pages functions build functions --outfile /tmp/oolita-worker.js

      - name: Redeploy with subscriber binding
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: npx --yes wrangler@latest pages deploy site --project-name=oolita --commit-dirty=true

      - name: Verify subscriber endpoint
        if: ${{ steps.subscriber_storage.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o /tmp/oolita-follow-health -w '%{http_code}' 'https://oolita.pages.dev/api/subscribe?health=1' || true)"
            if [ "$code" = "204" ]; then
              echo 'OOLITA subscriber endpoint verified (HTTP 204).'
              exit 0
            fi
            echo "Follow verification attempt $attempt returned HTTP $code"
            sleep 5
          done
          cat /tmp/oolita-follow-health || true
          exit 1

      - name: Summarize Follow activation
        if: ${{ steps.subscriber_storage.outcome == 'success' && success() }}
        shell: bash
        run: |
          {
            echo '### Follow OOLITA activation'
            echo ''
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Activated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '- Subscriber storage: Cloudflare D1'
            echo '- Endpoint: verified'
            echo '- Subscription state: active on submit'
          } >> "$GITHUB_STEP_SUMMARY"
