name: One-shot OOLITA audit branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-audit-branch-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Delete temporary audit branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete audit/live-production-20260823 || true

      - name: Remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          rm -f .github/workflows/cleanup-audit-branch-once.yml
          git add .github/workflows/cleanup-audit-branch-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove one-shot audit branch cleanup [skip ci]'
          git push origin HEAD:main
