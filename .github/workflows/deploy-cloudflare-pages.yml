      - 'scripts/build_wednesday_bank_v1.py'
      - 'social/wednesday_reels.json'
      - 'scripts/apply_wording_resilient.py'
      - 'scripts/apply_wording.py'
      - 'scripts/apply_direction_v3.py'
      - 'scripts/growth_prep.py'
      - 'scripts/apply_growth_v1.py'
      - 'scripts/apply_growth_v2.py'
      - 'scripts/apply_commerce.py'
      - 'scripts/apply_list_completion_v1.py'
      - 'scripts/apply_follow_transition_v1.py'
      - 'scripts/apply_release_calendar_v1.py'
      - 'scripts/apply_release_calendar_v2.py'
      - 'scripts/apply_master_release_calendar_v3.py'
      - 'scripts/repair_posters_archive_v1.py'
      - 'scripts/retire_sundays_campaign_v1.py'
      - 'scripts/apply_cloudflare_follow_v1.py'
      - 'scripts/apply_follow_mobile_finish.py'
      - 'scripts/normalize_audit_credit_sources_v1.py'
      - 'scripts/apply_audit_fixes_v1.py'
      - 'scripts/apply_desktop_sunday_panel_fix_v1.py'
      - 'scripts/apply_contrast_accessibility_v1.py'
      - 'scripts/apply_first_party_analytics_v1.py'
      - 'scripts/apply_public_identity_v2.py'
      - 'scripts/apply_public_identity_v3.py'
      - 'scripts/apply_search_visibility_v1.py'
      - 'scripts/apply_menu_hierarchy_v1.py'
      - 'scripts/normalize_labyrinth_fossil_dunes_v1.py'
      - 'scripts/normalize_labyrinth_fossil_dunes_v2.py'
      - 'scripts/preclean_hallazgo_legacy_urls_v1.py'
      - 'scripts/normalize_hallazgo_3d_castle_access_v1.py'
      - 'scripts/finalize_hallazgo_home_v1.py'
      - 'scripts/normalize_editions_hallazgo_hardback_v1.py'
      - 'scripts/apply_voice_audit_spanish_editions_v1.py'
      - 'scripts/apply_attribution_consistency_v2.py'
      - 'scripts/apply_seo_followup_v1.py'
      - 'scripts/publish_sunday03_and_3d_preview_v1.py'
      - 'scripts/publish_missing_sundays_v1.py'
      - 'social/published_sundays.json'
      - 'scripts/test_sunday_publications.py'
      - 'scripts/apply_engagement_depth_v1.py'
      - 'scripts/apply_arena_archive_link_v1.py'
      - 'scripts/configure_cloudflare_analytics.py'
      - 'scripts/configure_cloudflare_redirects.py'
      - 'scripts/configure_cloudflare_subscribers.py'
      - 'scripts/verify_cloudflare_analytics.py'
      - 'scripts/submit_indexnow.py'
      - 'scripts/audit_live_seo_v1.py'
      - 'scripts/apply_visitor_pressure_v1.py'
      - 'scripts/apply_historical_context_v1.py'
      - 'scripts/apply_home_precision_v1.py'
      - 'scripts/apply_parque_natural_alignment_v1.py'
      - 'scripts/apply_reader_paths_v1.py'
      - 'scripts/publish_ground_before_v1.py'
      - 'functions/**'
      - 'search/**'
      - 'commerce/**'
      - 'overrides/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish oolita'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oolita-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and validate complete site
        shell: bash
        run: bash scripts/build_site_for_deploy.sh

      - name: Apply and validate Cabo de Gata direction
        shell: bash
        run: python3 scripts/apply_direction_v3.py site

      - name: Apply and validate commerce configuration
        shell: bash
        run: python3 scripts/apply_commerce.py site commerce/catalog.json

      - name: Prepare homepage growth definition
        shell: bash
        run: python3 scripts/growth_prep.py site

      - name: Apply and validate growth layer
        shell: bash
        run: python3 scripts/apply_growth_v2.py site

      - name: Apply and validate improvement-list completion
        shell: bash
        run: python3 scripts/apply_list_completion_v1.py site

      - name: Normalize live attribution for legacy audit
        shell: bash
        run: python3 scripts/normalize_audit_credit_sources_v1.py site

      - name: Apply and validate accessibility, discovery and privacy audit fixes
        shell: bash
        run: python3 scripts/apply_audit_fixes_v1.py site

      - name: Install image tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Apply and validate search visibility
        shell: bash
        run: python3 scripts/apply_search_visibility_v1.py site

      - name: Apply native English editorial pass
        shell: bash
        run: python3 scripts/apply_english_native_edit_v1.py site

      - name: Apply homepage CTA clarity
        shell: bash
        run: python3 scripts/apply_cta_clarity_v1.py site

      - name: Apply final factual consistency guard
        shell: bash
        run: python3 scripts/apply_final_content_consistency_v2.py site

      - name: Apply final geology authority wording
        shell: bash
        run: python3 scripts/apply_geology_authority_v1.py site

      - name: Re-apply restrained editorial hrefs
        shell: bash
        run: python3 scripts/apply_editorial_internal_links_v1.py site

      - name: Validate final fossil-dune wording
        shell: bash
        run: python3 scripts/normalize_labyrinth_fossil_dunes_v2.py site

      - name: Apply final first-party analytics state
        shell: bash
        run: python3 scripts/apply_first_party_analytics_v1.py site

      - name: Finalize stable Google favicon
        shell: bash
        run: python3 scripts/finalize_google_favicon_v1.py site

      - name: Apply final Cloudflare email-protection exclusion
        shell: bash
        run: python3 scripts/apply_cloudflare_follow_v1.py site

      - name: Stop presenting the labyrinth as a destination
        shell: bash
        run: python3 scripts/apply_visitor_pressure_v1.py site

      - name: Align structured data, posters and footer with the Parque Natural letter
        shell: bash
        run: python3 scripts/apply_parque_natural_alignment_v1.py site

      - name: Place archival ground photograph on both labyrinth pages
        shell: bash
        run: python3 scripts/publish_ground_before_v1.py site

      - name: Apply approved homepage labyrinth title
        run: python3 scripts/apply_home_labyrinth_title_v1.py site

      - name: Apply approved bilingual historical context
        run: python3 scripts/apply_historical_context_v1.py site

      - name: Apply final bilingual homepage precision
        run: python3 scripts/apply_home_precision_v1.py site

      - name: Apply approved master release calendar
        shell: bash
        run: python3 scripts/apply_master_release_calendar_v3.py site

      - name: Preserve Sundays archive and retire stale launch framing
        shell: bash
        run: python3 scripts/retire_sundays_campaign_v1.py site

      - name: Audit final static hrefs, sitemap, canonicals and hreflang
        shell: bash
        run: python3 scripts/audit_static_integrity_v1.py site

      - name: Validate Pages Functions syntax
        shell: bash
        run: |
          node --check functions/api/event.js
          node --check functions/api/subscribe.js
          node --check functions/_middleware.js

      - name: Build Pages Functions bundle
        shell: bash
        run: npx --yes wrangler@latest pages functions build functions --outfile /tmp/oolita-worker.js

      - name: Report Cloudflare Analytics Engine binding
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c608b5c0e07dc00bd74aa24c9cc78c4a
        run: python3 scripts/verify_cloudflare_analytics.py

  deploy:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'DEPLOY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c608b5c0e07dc00bd74aa24c9cc78c4a

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN'
            exit 1
          fi

      - name: Reconstruct and validate complete site
        shell: bash
        run: bash scripts/build_site_for_deploy.sh

      - name: Apply and validate Cabo de Gata direction
        shell: bash
        run: python3 scripts/apply_direction_v3.py site

      - name: Apply and validate commerce configuration
        shell: bash
        run: python3 scripts/apply_commerce.py site commerce/catalog.json

      - name: Prepare homepage growth definition
        shell: bash
        run: python3 scripts/growth_prep.py site

      - name: Apply and validate growth layer
        shell: bash
        run: python3 scripts/apply_growth_v2.py site

      - name: Apply and validate improvement-list completion
        shell: bash
        run: python3 scripts/apply_list_completion_v1.py site

      - name: Normalize live attribution for legacy audit
        shell: bash
        run: python3 scripts/normalize_audit_credit_sources_v1.py site

      - name: Apply and validate accessibility, discovery and privacy audit fixes
        shell: bash
        run: python3 scripts/apply_audit_fixes_v1.py site

      - name: Install image tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Apply and validate search visibility
        shell: bash
        run: python3 scripts/apply_search_visibility_v1.py site

      - name: Apply native English editorial pass
        shell: bash
        run: python3 scripts/apply_english_native_edit_v1.py site

      - name: Apply homepage CTA clarity
        shell: bash
        run: python3 scripts/apply_cta_clarity_v1.py site

      - name: Apply final factual consistency guard
        shell: bash
        run: python3 scripts/apply_final_content_consistency_v2.py site

      - name: Apply final geology authority wording
        shell: bash
        run: python3 scripts/apply_geology_authority_v1.py site

      - name: Re-apply restrained editorial hrefs
        shell: bash
        run: python3 scripts/apply_editorial_internal_links_v1.py site

      - name: Validate final fossil-dune wording
        shell: bash
        run: python3 scripts/normalize_labyrinth_fossil_dunes_v2.py site

      - name: Apply final first-party analytics state
        shell: bash
        run: python3 scripts/apply_first_party_analytics_v1.py site

      - name: Finalize stable Google favicon
        shell: bash
        run: python3 scripts/finalize_google_favicon_v1.py site

      - name: Apply final Cloudflare email-protection exclusion
        shell: bash
        run: python3 scripts/apply_cloudflare_follow_v1.py site

      - name: Stop presenting the labyrinth as a destination
        shell: bash
        run: python3 scripts/apply_visitor_pressure_v1.py site

      - name: Align structured data, posters and footer with the Parque Natural letter
        shell: bash
        run: python3 scripts/apply_parque_natural_alignment_v1.py site

      - name: Place archival ground photograph on both labyrinth pages
        shell: bash
        run: python3 scripts/publish_ground_before_v1.py site

      - name: Apply approved homepage labyrinth title
        run: python3 scripts/apply_home_labyrinth_title_v1.py site

      - name: Audit final static hrefs, sitemap, canonicals and hreflang
        shell: bash
        run: python3 scripts/audit_static_integrity_v1.py site

      - name: Validate Pages Functions syntax
        shell: bash
        run: |
          node --check functions/api/event.js
          node --check functions/api/subscribe.js
          node --check functions/_middleware.js

      - name: Remove unsupported Analytics Engine binding
        id: analytics_binding
        shell: bash
        run: python3 scripts/configure_cloudflare_analytics.py

      - name: Finalize bilingual historical context, homepage precision and integrity
        shell: bash
        run: |
          python3 scripts/apply_historical_context_v1.py site
          python3 scripts/apply_home_precision_v1.py site
          python3 scripts/apply_master_release_calendar_v3.py site
          python3 scripts/retire_sundays_campaign_v1.py site
          python3 scripts/audit_static_integrity_v1.py site

      - name: Deploy complete site to Cloudflare Pages
        id: deploy_site
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy site --project-name=oolita --branch=main --commit-dirty=true

      - name: Verify approved release calendar is live
        id: live_release_calendar
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if python3 - <<'PY'
          import os
          import urllib.request

          sha = os.environ["GITHUB_SHA"]
          base = "https://oolita.es"
          checks = {
              "/": (
                  ("23.05.2027", "00:00 CEST", "16.09.27", "19.09.27"),
                  (),
              ),
              "/en/": (
                  ("23 May 2027", "00:00 CEST", "16 Sep 27", "19 Sep 27"),
                  (),
              ),
              "/mundo-3d/": (
                  ("23.05.27", "23 de mayo"),
                  ("03.01.27", "3 de enero de 2027", "00:00 CET"),
              ),
              "/en/3d-world/": (
                  ("23.05.27", "23 May"),
                  ("03.01.27", "3 January 2027", "00:00 CET"),
              ),
              "/ediciones/": (
                  ("27.06.27", "25.07.27", "16.09.27", "19.09.27"),
                  ("31.01.27", "11.04.27"),
              ),
              "/en/editions/": (
                  ("27.06.27", "25.07.27"),
                  ("31.01.27", "11.04.27", "31 January 2027", "11 April"),
              ),
              "/ediciones/libro/": (
                  ("27.06.27", "27 de junio de 2027", "cinco semanas"),
                  ("31.01.27", "31 de enero de 2027"),
              ),
              "/en/editions/book/": (
                  ("27 Jun 27", "27 June 2027", "five weeks"),
                  ("31 Jan 27", "31 January 2027"),
              ),
              "/ediciones/camiseta/": (
                  ("25.07.27", "25 de julio de 2027", "hasta el verano"),
                  ("11.04.27", "11 de abril de 2027"),
              ),
              "/en/editions/t-shirt/": (
                  ("25.07.27", "25 July 2027", "through to summer"),
                  ("11.04.27", "11 April 2027"),
              ),
              "/catalogo-hallazgo/": (
                  ("16.09.27", "19.09.27"),
                  (),
              ),
              "/en/hallazgo-catalogue/": (
                  ("16 SEP 27", "19 Sep 27"),
                  (),
              ),
          }

          for path, (required, forbidden) in checks.items():
              url = f"{base}{path}?deploy={sha}"
              req = urllib.request.Request(
                  url,
                  headers={"Cache-Control": "no-cache", "User-Agent": "OOLITA-deploy-audit/1.0"},
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  html = response.read().decode("utf-8", "replace")
              missing = [token for token in required if token not in html]
              stale = [token for token in forbidden if token in html]
              if missing or stale:
                  raise SystemExit(
                      f"{path}: missing={missing!r} stale={stale!r}"
                  )
          PY
            then
              echo "Canonical domain is serving the approved 2027 release calendar."
              exit 0
            fi
            echo "Release-calendar verification attempt $attempt not current yet."
            sleep 5
          done
          echo "Canonical domain did not converge to the approved release calendar."
          exit 1

      - name: Verify Sundays archive is preserved on canonical domain
        id: live_sundays_retired
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if python3 - <<'PY'
          import os
          import re
          import urllib.request
          from urllib.parse import urlsplit

          sha = os.environ["GITHUB_SHA"]
          base = "https://oolita.es"
          pages = (
              "/",
              "/en/",
              "/carteles/",
              "/en/posters/",
              "/laberinto/",
              "/en/labyrinth/",
              "/mundo-3d/",
              "/en/3d-world/",
              "/sobre-oolita/",
              "/en/about/",
              "/ediciones/camiseta/",
              "/en/editions/t-shirt/",
          )
          forbidden = (
              re.compile(r"22\s+Sundays", re.I),
              re.compile(r"22\s+domingos", re.I),
              re.compile(r"22[- ]Sunday", re.I),
              re.compile(r"03\.01\.(?:27|2027)", re.I),
              re.compile(r"\b3 January(?: 2027)?\b", re.I),
              re.compile(r"\b3 Jan(?:uary)?(?: 2027| 27)?\b", re.I),
              re.compile(r"\b3 de enero(?: de 2027)?\b", re.I),
              re.compile(r"\b03 (?:JAN|ENE) 27\b", re.I),
              re.compile(r"Sunday by Sunday", re.I),
              re.compile(r"domingo a domingo", re.I),
              re.compile(r"cartel-03\.(?:avif|webp|png)", re.I),
          )

          for path in pages:
              url = f"{base}{path}?retirement={sha}"
              req = urllib.request.Request(
                  url,
                  headers={"Cache-Control": "no-cache", "User-Agent": "OOLITA-retirement-audit/1.0"},
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  html = response.read().decode("utf-8", "replace")
              hits = [pattern.pattern for pattern in forbidden if pattern.search(html)]
              if hits:
                  raise SystemExit(f"{path}: retired campaign material remains: {hits!r}")

          sunday_pages = (
              "/domingos/",
              "/en/sundays/",
              "/domingos/01-el-doble/",
              "/en/sundays/01-the-double/",
              "/domingos/06-el-mapa/",
              "/en/sundays/06-the-map/",
          )
          for path in sunday_pages:
              url = f"{base}{path}?sundays={sha}"
              req = urllib.request.Request(
                  url,
                  headers={"Cache-Control": "no-cache", "User-Agent": "OOLITA-sundays-audit/1.0"},
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  status = response.status
                  final_path = urlsplit(response.geturl()).path
                  html = response.read().decode("utf-8", "replace")
              if status != 200 or final_path != path:
                  raise SystemExit(
                      f"{path}: expected its own 200 page, got status={status} final={final_path!r}"
                  )
              if path in {"/domingos/", "/en/sundays/"}:
                  required = ("42", "23.05.2027")
                  missing = [token for token in required if token not in html]
                  if missing:
                      raise SystemExit(f"{path}: preserved archive missing {missing!r}")

          print("Canonical domain is free of obsolete 22-part launch framing.")
          print("Domingos / Sundays archive and published entry URLs return their own 200 pages.")
          PY
            then
              echo "Canonical domain has converged to the preserved-Sundays state."
              exit 0
            fi
            echo "Sundays-preservation verification attempt $attempt not current yet."
            sleep 5
          done
          echo "Canonical domain did not converge to the preserved-Sundays state."
          exit 1

      - name: Verify corrected bilingual homepage is live on canonical domain
        id: live_home_copy
        shell: bash
        run: |
          set -euo pipefail
          es_url="https://oolita.es/?deploy=$GITHUB_SHA"
          en_url="https://oolita.es/en/?deploy=$GITHUB_SHA"
          for attempt in $(seq 1 18); do
            curl -fsS -H 'Cache-Control: no-cache' "$es_url" -o /tmp/oolita-es.html || true
            curl -fsS -H 'Cache-Control: no-cache' "$en_url" -o /tmp/oolita-en.html || true

            es_ok=0
            en_ok=0
            if grep -Fq 'Tres metros de trazado clásico, piedra suelta colocada en seco en 2021:' /tmp/oolita-es.html 2>/dev/null \
               && ! grep -Eq '<h2[^>]*>[[:space:]]*Los Escullos[[:space:]]*</h2>' /tmp/oolita-es.html 2>/dev/null \
               && ! grep -Fq 'El original está en Los Escullos' /tmp/oolita-es.html 2>/dev/null; then
              es_ok=1
            fi

            if grep -Fq 'Three metres of classical design, dry-laid in loose stone in 2021:' /tmp/oolita-en.html 2>/dev/null \
               && ! grep -Eq '<h2[^>]*>[[:space:]]*(Los Escullos|Oolita)[[:space:]]*</h2>' /tmp/oolita-en.html 2>/dev/null \
               && ! grep -Fq 'The original is at Los Escullos' /tmp/oolita-en.html 2>/dev/null; then
              en_ok=1
            fi

            if [ "$es_ok" = 1 ] && [ "$en_ok" = 1 ]; then
              echo "Canonical domain is serving the corrected ES/EN homepage."
              exit 0
            fi

            echo "Canonical homepage verification attempt $attempt not current yet."
            sleep 5
          done

          echo 'Canonical domain is still serving stale homepage content.'
          echo '--- Spanish evidence ---'
          grep -E 'Los Escullos|Tres metros de trazado clásico|El original está' /tmp/oolita-es.html | head -n 20 || true
          echo '--- English evidence ---'
          grep -E 'Los Escullos|Oolita|Three metres of classical design|The original is at' /tmp/oolita-en.html | head -n 20 || true
          exit 1

      - name: Verify archival ground plate is live on both labyrinth pages
        id: live_ground_archive
        shell: bash
        run: |
          set -euo pipefail
          es_url="https://oolita.es/laberinto/?deploy=$GITHUB_SHA"
          en_url="https://oolita.es/en/labyrinth/?deploy=$GITHUB_SHA"
          img_url="https://oolita.es/laberinto/el-suelo-antes-photo.jpg?deploy=$GITHUB_SHA"

          ok=0
          for attempt in $(seq 1 18); do
            curl -fsS -H 'Cache-Control: no-cache' "$es_url" -o /tmp/oolita-lab-es.html || true
            curl -fsS -H 'Cache-Control: no-cache' "$en_url" -o /tmp/oolita-lab-en.html || true
            curl -fsS -H 'Cache-Control: no-cache' "$img_url" -o /tmp/oolita-ground-before.jpg || true

            if python3 - <<'PY'
          from pathlib import Path

          checks = (
              (Path("/tmp/oolita-lab-es.html"), "Linaje"),
              (Path("/tmp/oolita-lab-en.html"), "Lineage"),
          )
          for path, next_heading in checks:
              html = path.read_text(encoding="utf-8", errors="replace")
              assert html.count('data-oolita-ground-before="true"') == 1
              assert html.count('data-oolita-ground-before-version="flush-caption-v3"') == 1
              assert html.count('/laberinto/el-suelo-antes-photo.jpg') == 1
              assert html.count('>el suelo antes<') == 1
              assert html.count('>OOLITA · septiembre 2021<') == 1
              assert html.index('data-oolita-ground-before="true"') < html.index(next_heading)
          PY
            then
              dims="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 /tmp/oolita-ground-before.jpg 2>/dev/null || true)"
              if [ "$dims" = "1200x1200" ]; then
                ok=1
                break
              fi
            fi

            echo "Archival plate verification attempt $attempt not current yet."
            sleep 5
          done

          if [ "$ok" != 1 ]; then
            echo "Canonical labyrinth pages are not serving the approved archival plate."
            exit 1
          fi

          echo "Canonical ES/EN labyrinth pages serve the approved ground-before archive in the intended placement."

      - name: Configure canonical host redirect
        id: canonical_redirect
        continue-on-error: true
        shell: bash
        run: python3 scripts/configure_cloudflare_redirects.py

      - name: Verify first-party analytics endpoint
        id: analytics_verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          payload='{"event":"deployment-health","path":"/","href":""}'
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o /tmp/oolita-analytics-response -w '%{http_code}' -X POST \
              -H 'Content-Type: text/plain;charset=UTF-8' \
              --data "$payload" \
              https://oolita.pages.dev/api/event || true)"
            if [ "$code" = "204" ]; then
              echo 'OOLITA analytics endpoint verified (HTTP 204).'
              exit 0
            fi
            echo "Analytics verification attempt $attempt returned HTTP $code"
            sleep 5
          done
          cat /tmp/oolita-analytics-response || true
          exit 1

      - name: Submit updated URLs to IndexNow
        id: indexnow
        continue-on-error: true
        shell: bash
        run: python3 scripts/submit_indexnow.py site/sitemap.xml search/indexnow-key.txt

      - name: Audit live technical SEO
        id: live_seo
        continue-on-error: true
        shell: bash
        run: python3 scripts/audit_live_seo_v1.py https://oolita.es

      - name: Summarize deployment and service checks
        if: ${{ always() && steps.deploy_site.outcome == 'success' }}
        shell: bash
        run: |
          {
            echo '### OOLITA production deployment'
            echo ''
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Deployed: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Analytics binding cleanup: ${{ steps.analytics_binding.outcome }}"
            echo "- Analytics endpoint: ${{ steps.analytics_verify.outcome }}"
            echo "- Canonical host redirect: ${{ steps.canonical_redirect.outcome }}"
            echo "- IndexNow: ${{ steps.indexnow.outcome }}"
            echo "- Live technical SEO: ${{ steps.live_seo.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

