name: Deploy OOLITA to Cloudflare Pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_site_for_deploy.sh'
      - 'scripts/apply_wording_resilient.py'
      - 'scripts/apply_wording.py'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish oolita'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oolita-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate candidate deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/build_site_for_deploy.sh
          bash scripts/build_site_for_deploy.sh

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c608b5c0e07dc00bd74aa24c9cc78c4a

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN'
            exit 1
          fi

      - name: Reconstruct current complete Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site

          curl -fsSL https://oolita.pages.dev/sitemap.xml -o /tmp/sitemap.xml
          cp /tmp/sitemap.xml site/sitemap.xml

          python3 - <<'PY' > /tmp/page-urls.txt
          import re
          from urllib.parse import urlsplit

          text = open('/tmp/sitemap.xml', encoding='utf-8').read()
          locs = re.findall(r'<loc>\s*(.*?)\s*</loc>', text, flags=re.I | re.S)
          if not locs:
              raise SystemExit('No URLs found in sitemap.xml')

          seen = set()
          for loc in locs:
              path = urlsplit(loc.strip()).path or '/'
              url = 'https://oolita.pages.dev' + path
              if url not in seen:
                  print(url)
                  seen.add(url)
          PY

          wget \
            --page-requisites \
            --no-host-directories \
            --directory-prefix=site \
            --domains=oolita.pages.dev \
            --execute robots=off \
            --input-file=/tmp/page-urls.txt

          curl -fsSL https://oolita.pages.dev/robots.txt -o site/robots.txt
          curl -fsSL https://oolita.pages.dev/favicon.svg -o site/favicon.svg
          curl -fsSL https://oolita.pages.dev/404.html -o site/404.html || true

      - name: Apply reviewed wording
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_wording.py site

      - name: Overlay reviewed files if present
        shell: bash
        run: |
          set -euo pipefail
          if [ -d overrides ]; then
            cp -a overrides/. site/
          fi

      - name: Safety checks
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/en/index.html
          test -f site/laberinto/index.html
          test -f site/en/labyrinth/index.html
          test -f site/domingos/index.html
          test -f site/sitemap.xml
          test -f site/robots.txt
          test -f site/favicon.svg

          grep -Fq 'El mismo camino, hecho de luz.' site/index.html
          grep -Fq 'The same path, made of light.' site/en/index.html
          grep -Fq 'La misma senda en tres materiales.' site/index.html
          grep -Fq 'The same path in three materials.' site/en/index.html
          grep -Fq '48-page bilingual fable' site/en/posters/index.html

          count=$(find site -type f | wc -l)
          echo "Reconstructed file count: $count"
          if [ "$count" -lt 80 ]; then
            echo 'Site reconstruction looks incomplete; refusing to deploy.'
            exit 1
          fi

          bad=$(find site \( -name '*.bak*' -o -name '*.py' -o -name '*~' -o -name '.DS_Store' \) -print)
          if [ -n "$bad" ]; then
            echo 'Refusing to deploy forbidden files:'
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Deploy complete site to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy site --project-name=oolita --commit-dirty=true
