name: Deploy OOLITA to Cloudflare Pages

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - 'scripts/build_site_for_deploy.sh'
      - 'scripts/apply_wording_resilient.py'
      - 'scripts/apply_wording.py'
      - 'scripts/apply_direction_v3.py'
      - 'scripts/growth_prep.py'
      - 'scripts/apply_growth_v1.py'
      - 'overrides/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - 'scripts/build_site_for_deploy.sh'
      - 'scripts/apply_wording_resilient.py'
      - 'scripts/apply_wording.py'
      - 'scripts/apply_direction_v3.py'
      - 'scripts/growth_prep.py'
      - 'scripts/apply_growth_v1.py'
      - 'overrides/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish oolita'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: oolita-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and validate complete site
        shell: bash
        run: bash scripts/build_site_for_deploy.sh

      - name: Apply and validate Cabo de Gata direction
        shell: bash
        run: python3 scripts/apply_direction_v3.py site

      - name: Prepare homepage growth definition
        shell: bash
        run: python3 scripts/growth_prep.py site

      - name: Apply and validate growth layer
        shell: bash
        run: python3 scripts/apply_growth_v1.py site

  deploy:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'DEPLOY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c608b5c0e07dc00bd74aa24c9cc78c4a

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN'
            exit 1
          fi

      - name: Reconstruct and validate complete site
        shell: bash
        run: bash scripts/build_site_for_deploy.sh

      - name: Apply and validate Cabo de Gata direction
        shell: bash
        run: python3 scripts/apply_direction_v3.py site

      - name: Prepare homepage growth definition
        shell: bash
        run: python3 scripts/growth_prep.py site

      - name: Apply and validate growth layer
        shell: bash
        run: python3 scripts/apply_growth_v1.py site

      - name: Deploy complete site to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy site --project-name=oolita --commit-dirty=true

      - name: Record successful deployment
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          printf 'commit=%s\nrun_id=%s\ndeployed_at=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deploy-status/latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy-status/latest.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record successful OOLITA deployment [skip ci]'
          git push
