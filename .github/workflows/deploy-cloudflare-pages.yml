      - 'scripts/apply_home_precision_v1.py'
      - 'scripts/apply_parque_natural_alignment_v1.py'
      - 'scripts/apply_reader_paths_v1.py'
      - 'scripts/publish_ground_before_v1.py'
      - 'functions/**'
      - 'search/**'
      - 'commerce/**'
      - 'overrides/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - 'wrangler.toml'
      - 'scripts/build_site_for_deploy.sh'
      - 'scripts/finalize_google_favicon_v1.py'
      - 'scripts/apply_content_consistency_v1.py'
      - 'scripts/apply_final_content_consistency_v2.py'
      - 'scripts/apply_geology_authority_v1.py'
      - 'scripts/apply_editorial_internal_links_v1.py'
      - 'scripts/audit_static_integrity_v1.py'
      - 'scripts/apply_original_audit_completion_v1.py'
