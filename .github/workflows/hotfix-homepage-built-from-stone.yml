name: Hotfix exact homepage stone wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-homepage-built-from-stone.yml'

permissions:
  contents: write

concurrency:
  group: oolita-homepage-built-from-stone-hotfix
  cancel-in-progress: true

jobs:
  deploy-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c608b5c0e07dc00bd74aa24c9cc78c4a
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mirror current production site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          python3 scripts/mirror_oolita.py site

      - name: Apply and verify exact approved wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/en/index.html')
          if not p.is_file():
              raise SystemExit('Missing site/en/index.html')
          text = p.read_text(encoding='utf-8')
          for old in (
              'laid by hand in 2021 from loose calcarenite',
              'laid by hand in 2021 from stone',
          ):
              text = text.replace(old, 'built from stone')
          p.write_text(text, encoding='utf-8')
          final = p.read_text(encoding='utf-8')
          if 'loose calcarenite' in final:
              raise SystemExit('Old wording remains after hotfix')
          if 'built from stone' not in final:
              raise SystemExit('Exact approved wording missing after hotfix')
          print('Homepage hotfix verified exactly: built from stone.')
          PY

      - name: Deploy exact hotfix to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy site --project-name=oolita --commit-dirty=true

      - name: Record exact hotfix deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p hotfix-status
          printf 'commit=%s\nrun_id=%s\ndeployed_at=%s\nwording=built from stone\nexact=true\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$now" > hotfix-status/homepage-built-from-stone.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hotfix-status/homepage-built-from-stone.txt
          git commit -m 'Record exact homepage stone hotfix [skip ci]'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
